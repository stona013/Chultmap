<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chult Karte</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Chult Karte</strong>
      <span id="connectionStatus" class="status status-warn">Verbinde...</span>
    </div>

    <div class="tracker">
      <span class="tracker-label">Tage Unterwegs</span>
      <button id="dayMinusBtn" type="button">−</button>
      <strong id="daysValue">0</strong>
      <button id="dayPlusBtn" type="button">+</button>
    </div>

    <div class="actions">
      <button id="addModeBtn" type="button">Marker setzen</button>

      <button id="drawModeBtn" type="button">Stift</button>

      <label class="tool-control">
        Farbe
        <input id="drawColor" type="color" value="#d32f2f">
      </label>

      <label class="tool-control">
        Größe
        <input id="drawSize" type="range" min="2" max="30" value="6">
        <span id="drawSizeValue">6</span>
      </label>

      <button id="eraserModeBtn" type="button">Radiergummi</button>
      <button id="notebookBtn" type="button">Notizbuch</button>
      <button id="reloadBtn" type="button">Neu laden</button>
    </div>
  </header>

  <main>
    <div id="map"></div>

    <div id="configError" class="config-error hidden">
      <div>
        <h2>Supabase ist noch nicht eingerichtet</h2>
        <p>
          Trage in <code>config.js</code> deine Supabase Project URL und deinen öffentlichen Key ein.
        </p>
      </div>
    </div>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Marker</h2>

      <label>
        Titel
        <input id="markerTitle" maxlength="80" autocomplete="off">
      </label>

      <label>
        Kategorie
        <select id="markerCategory">
          <option value="place">Ort</option>
          <option value="danger">Gefahr</option>
          <option value="quest">Quest</option>
          <option value="camp">Lager</option>
          <option value="npc">NPC</option>
          <option value="note">Notiz</option>
        </select>
      </label>

      <label>
        Notiz
        <textarea id="markerNote" rows="6" maxlength="2000"></textarea>
      </label>

      <div class="modal-actions">
        <button id="deleteBtn" type="button" class="danger hidden">Löschen</button>
        <span class="spacer"></span>
        <button id="cancelBtn" type="button">Abbrechen</button>
        <button id="saveBtn" type="button" class="primary">Speichern</button>
      </div>
    </section>
  </div>


  <div id="notebookBackdrop" class="modal-backdrop hidden">
    <section class="notebook" role="dialog" aria-modal="true">
      <aside class="notebook-sidebar">
        <div class="notebook-sidebar-header">
          <h2>Notizbuch</h2>
          <button id="newPageBtn" type="button">Neue Seite</button>
        </div>
        <div id="notebookPages" class="notebook-pages"></div>
      </aside>
      <div class="notebook-editor">
        <div class="notebook-editor-top">
          <input id="pageTitle" class="page-title" maxlength="120" placeholder="Seitentitel">
          <button id="closeNotebookBtn" type="button">Schließen</button>
        </div>
        <textarea id="pageContent" class="page-content" placeholder="Notizen eingeben..."></textarea>
        <div class="notebook-footer">
          <span id="pageSaveStatus" class="save-status"></span>
          <span class="spacer"></span>
          <button id="deletePageBtn" type="button" class="danger hidden">Seite löschen</button>
          <button id="savePageBtn" type="button" class="primary">Seite speichern</button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
